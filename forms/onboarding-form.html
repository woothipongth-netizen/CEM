  {id:"7.2", hint:"ใช้เลือกเพลงจากคลังของร้าน", sec:7, t:"มีคลังเพลงใน Drive ไหม (ตอบเมื่อเลือกใช้คลังเพลงในข้อ 5.3)", type:"single", opts:[["มี","วางลิงก์โฟลเดอร์ด้านล่าง"],["ยังไม่มี","ส่งไฟล์เพลงในแชททุกงาน"]], other:"ลิงก์โฟลเดอร์คลังเพลง"},
  {id:"7.3", hint:"ใช้เลือกเสียงเอฟเฟกต์จากคลังของร้าน", sec:7, t:"มีคลังเสียงเอฟเฟกต์ (SFX) ใน Drive ไหม", type:"single", opts:[["มี","วางลิงก์โฟลเดอร์ด้านล่าง"],["ยังไม่มี","ใช้ SFX ในตัว (whoosh, sparkle)"]], other:"ลิงก์โฟลเดอร์คลัง SFX"},
  {id:"7.3b", hint:"ใช้คัดแนวเสียงเอฟเฟกต์ให้เข้ากับร้าน", sec:7, t:"เสียงเอฟเฟกต์แนวไหน", type:"single", opts:[["นุ่ม ละมุน","whoosh pop sparkle กระดิ่ง ไม่มีเสียงทุบ"],["หนักแน่น มีพลัง","มีเสียงกระแทก hit / boom"],["สนุก แนวมีม"]]},
  {id:"7.4", hint:"ใช้ถอดเสียงและพากย์ด้วย AI", sec:7, t:"คีย์ ElevenLabs (ห้ามพิมพ์คีย์ในฟอร์มนี้)", type:"single", opts:[["มีคีย์","Claude จะเปิดฟอร์มปลอดภัยให้ใส่คีย์ในแชท"],["ยังไม่มี"]]},
];

let A = {};
try { A = JSON.parse(localStorage.getItem("onb-draft-CEM") || "{}") || {}; } catch (e) { A = {}; }
const get = id => (A[id] ||= {sel: [], other: "", skip: "", top: ""});

const form = document.getElementById("f");
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "text") e.textContent = v; else if (v !== undefined && v !== null) e.setAttribute(k, v); }
  kids.forEach(k => k && e.append(k));
  return e;
}

function build() {
  form.innerHTML = "";
  SECTIONS.forEach((name, i) => {
    form.append(el("h2", {id: "s" + (i + 1), text: `หมวด ${i + 1}: ${name}`}));
    Q.filter(q => q.sec === i + 1).forEach(q => form.append(card(q)));
  });
  refresh();
}

function card(q) {
  const a = get(q.id);
  const box = el("section", {class: "q", id: "q" + q.id.replace(".", "-")});
  const head = el("div", {class: "qh"}, el("span", {class: "qn", text: q.id}),
    el("span", {class: "qt", text: q.t + (q.type === "multi" ? " (เลือกได้หลายข้อ)" : "") + (q.req ? " *" : "")}));
  box.append(head);
  if (q.hint) box.append(el("div", {class: "hint", text: q.hint}));
  if (q.opts) {
    const row = el("div", {class: "opts", role: "group", "aria-label": q.t});
    q.opts.forEach(([label, desc]) => {
      const b = el("button", {type: "button", class: "opt" + (q.wide ? " wide" : ""), "aria-pressed": String(a.sel.includes(label))});
      b.append(document.createTextNode(label));
      if (desc) b.append(el("small", {text: desc}));
      b.addEventListener("click", () => {
        if (q.type === "multi") a.sel = a.sel.includes(label) ? a.sel.filter(x => x !== label) : [...a.sel, label];
        else a.sel = a.sel[0] === label ? [] : [label];
        if (a.sel.length) a.skip = "";
        save(); build(); document.getElementById(box.id)?.querySelector(".opt")?.focus({preventScroll: true});
      });
      row.append(b);
    });
    box.append(row);
  }
  if (q.top) {
    const f = el("div", {class: "follow"});
    f.hidden = a.sel.length < (q.id === "4.2" ? 2 : 4);
    f.append(el("div", {class: "hint", text: q.topq || "เลือกไว้หลายข้อ ข้อไหนสำคัญที่สุด"}));
    const row = el("div", {class: "opts"});
    [...a.sel, ...(q.id === "2.2" ? ["เท่ากันหมด"] : [])].forEach(label => {
      const b = el("button", {type: "button", class: "opt", "aria-pressed": String(a.top === label), text: label});
      b.addEventListener("click", () => { a.top = a.top === label ? "" : label; save(); build(); });
      row.append(b);
    });
    f.append(row);
    box.append(f);
  }
  if (q.other) {
    const inp = el("input", {type: "text", id: "o" + q.id.replace(".", "-"), placeholder: q.other, "aria-label": q.other});
    inp.value = a.other;
    inp.addEventListener("input", () => { a.other = inp.value; if (inp.value.trim()) a.skip = ""; save(); refresh(); });
    box.append(inp);
  }
  if (!q.noskip) {
    const sk = el("div", {class: "skips"});
    [SKIP, NA].forEach(s => {
      const b = el("button", {type: "button", class: "skip", "aria-pressed": String(a.skip === s), text: s});
      b.addEventListener("click", () => { a.skip = a.skip === s ? "" : s; if (a.skip) { a.sel = []; a.top = ""; } save(); build(); });
      sk.append(b);
    });
    box.append(sk);
  }
  return box;
}

const answered = q => { const a = get(q.id); return a.sel.length > 0 || a.other.trim() !== "" || a.skip !== ""; };
function refresh() {
  const nav = document.getElementById("secs"); nav.innerHTML = "";
  SECTIONS.forEach((name, i) => {
    const qs = Q.filter(q => q.sec === i + 1), n = qs.filter(answered).length;
    nav.append(el("a", {href: "#s" + (i + 1), class: n === qs.length ? "done" : "", text: `${i + 1} ${name} ${n}/${qs.length}`}));
  });
}
function save() { try { localStorage.setItem("onb-draft-CEM", JSON.stringify(A)); } catch (e) {} }

function summary() {
  return Q.map(q => {
    const a = get(q.id); let s;
    if (a.skip) s = a.skip;
    else { s = a.sel.join(" · "); if (a.other.trim()) s += (s ? " · " : "") + "พิมพ์: " + a.other.trim(); if (!s) s = "(ยังไม่ตอบ)"; }
    if (a.top) s += " · สำคัญที่สุด: " + a.top;
    return `${q.id} ${q.t}: ${s}`;
  }).join("\n");
}

const status = document.getElementById("status");
function setStatus(t, warn) { status.textContent = t; status.classList.toggle("warn", !!warn); }

function missing() {
  document.querySelectorAll(".q.req-miss").forEach(e => e.classList.remove("req-miss"));
  const miss = Q.filter(q => q.req && !(get(q.id).sel.length || get(q.id).other.trim()));
  miss.forEach(q => document.getElementById("q" + q.id.replace(".", "-"))?.classList.add("req-miss"));
  return miss;
}

let dbP = null;
async function db() { if (!dbP) dbP = (window.claude?.use ? window.claude.use("db") : Promise.resolve(null)); return dbP; }

document.getElementById("send").addEventListener("click", async () => {
  const miss = missing();
  if (miss.length) { setStatus("ต้องตอบข้อ " + miss.map(q => q.id).join(", ") + " ก่อนส่ง", true); document.getElementById("q" + miss[0].id.replace(".", "-")).scrollIntoView({behavior: "smooth", block: "center"}); return; }
  const text = summary();
  const out = document.getElementById("out"); out.textContent = text; out.hidden = false; document.getElementById("result-h").hidden = false;
  setStatus("กำลังส่ง…");
  try {
    const d = await db();
    if (!d) { setStatus("ส่งเข้าระบบไม่ได้ในหน้านี้ กด คัดลอกคำตอบ แล้ววางในแชทแทน", true); return; }
    await d.doc("onboarding/answers").set({answers: JSON.parse(JSON.stringify(A)), text, submittedAt: new Date().toISOString(), form: "07-onboarding v2", repo: "CEM"});
    setStatus("ส่งแล้ว · บอก Claude ในแชทว่า \"ตอบแบบสอบถามแล้ว\"");
  } catch (e) {
    setStatus("ส่งไม่สำเร็จ กด คัดลอกคำตอบ แล้ววางในแชทแทน", true);
  }
});

document.getElementById("copy").addEventListener("click", async () => {
  const text = summary();
  const out = document.getElementById("out"); out.textContent = text; out.hidden = false; document.getElementById("result-h").hidden = false;
  try { await navigator.clipboard.writeText(text); setStatus("คัดลอกแล้ว วางในแชทได้เลย"); }
  catch (e) { const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); setStatus("เลือกข้อความไว้แล้ว กดคัดลอกเองได้"); }
});

build();
// เปิดหน้าแล้วโหลดคำตอบที่เคยส่ง (ถ้ามี และยังไม่มีฉบับร่างในเครื่อง)
(async () => {
  try {
    const d = await db(); if (!d) return;
    const snap = await d.doc("onboarding/answers").get();
    if (snap.exists && !Object.keys(A).length) { A = snap.data().answers || {}; build(); setStatus("โหลดคำตอบที่เคยส่งแล้ว แก้แล้วส่งใหม่ได้"); }
  } catch (e) {}
})();
</script>
