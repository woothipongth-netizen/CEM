<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "Brand"; font-weight: 500; src: url("fonts/brand-thai-500-normal.woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: "Brand"; font-weight: 500; src: url("fonts/brand-latin-500-normal.woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+201C-201D; }
      @font-face { font-family: "Brand"; font-weight: 700; src: url("fonts/brand-thai-700-normal.woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: "Brand"; font-weight: 700; src: url("fonts/brand-latin-700-normal.woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+201C-201D; }
      @font-face { font-family: "Brand"; font-weight: 800; src: url("fonts/brand-thai-800-normal.woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: "Brand"; font-weight: 800; src: url("fonts/brand-latin-800-normal.woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+201C-201D; }
      :root {
        --accent: {{ACCENT}};
        --accent-hi: {{ACCENT_LIGHT}};
        --accent-dk: {{ACCENT_DARK}};
        --cream: #fffaf2;
        --ink: #2a2420;
        --star: #ffb92e;
        --font: "Brand", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font); }
      em { font-style: normal; color: var(--accent-dk); }

      .shot { position: absolute; inset: 0; overflow: hidden; }
      .shot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #warm { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,190,120,0.08), rgba(255,170,90,0.05)); mix-blend-mode: soft-light; }
      #edge { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 72%, rgba(0,0,0,0.4) 100%); }

      /* ประโยคเปิด */
      .hook { position: absolute; left: 70px; right: 70px; top: 150px; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .hk-q { font-size: 220px; font-weight: 800; line-height: 0.8; height: 120px; color: var(--accent); text-shadow: 0 6px 24px rgba(0,0,0,0.3); }
      .hk-tx { font-size: 96px; font-weight: 800; line-height: 1.25; color: #fff; text-shadow: 0 4px 28px rgba(0,0,0,0.55); }
      .hk-tx em { color: var(--accent-hi); }

      /* หัวข้อแคปซูล */
      .title { position: absolute; top: 150px; left: 60px; right: 60px; display: flex; justify-content: center; }
      .pill { display: inline-flex; align-items: center; gap: 20px; background: var(--cream); border-radius: 80px; padding: 14px 44px 24px 30px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
      .pill .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); margin-top: 10px; }
      .pill .tx { font-size: 60px; font-weight: 800; color: var(--ink); line-height: 1.3; }

      /* คำสำคัญที่ลูกค้าพูด */
      .kw { position: absolute; left: 40px; right: 40px; bottom: 470px; display: flex; justify-content: center; }
      .kw.kw-high { bottom: 520px; }
      .kw.kw-low { bottom: 400px; }
      .kw-in { position: relative; display: inline-flex; align-items: flex-start; gap: 8px; padding: 0 30px 10px; }
      .kt { font-size: 140px; font-weight: 800; line-height: 1.25; color: #fff; white-space: nowrap;
            text-shadow: 0 6px 30px rgba(0,0,0,0.55), 0 2px 4px rgba(0,0,0,0.4); }
      .kt em { color: var(--accent-hi); }
      .kq { font-size: 140px; font-weight: 800; line-height: 1; color: var(--accent); text-shadow: 0 4px 16px rgba(0,0,0,0.4); }
      .kbar { position: absolute; left: 0; right: 0; bottom: 18px; height: 34px; border-radius: 17px; background: var(--accent); opacity: 0.85;
              transform-origin: 0 50%; z-index: -1; }
      .kw-in > :not(.kbar) { position: relative; }

      /* ซับในกล่องคำพูด */
      .line { position: absolute; left: 50px; right: 50px; bottom: 290px; text-align: center; }
      .line span { position: relative; display: inline-block; padding: 14px 34px 24px; border-radius: 30px; background: #fff;
                   color: var(--ink); font-size: 56px; font-weight: 700; line-height: 1.32; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
      .line span::after { content: ""; position: absolute; left: 70px; bottom: -22px; border-left: 0 solid transparent; border-right: 34px solid transparent; border-top: 24px solid #fff; }

      /* การ์ดจบ */
      #endshade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(40,25,10,0.3), rgba(30,20,10,0.75)); }
      .end { position: absolute; left: 50px; right: 50px; top: 700px; display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center; }
      .end-name { font-size: 120px; font-weight: 800; color: #fff; line-height: 1.25; overflow-wrap: anywhere; text-shadow: 0 6px 30px rgba(0,0,0,0.5); }
      .end-sub { font-size: 50px; font-weight: 500; color: #fff; }
      .end-cta { font-size: 58px; font-weight: 800; color: var(--ink); background: var(--accent); padding: 16px 54px 26px; border-radius: 60px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
      <audio id="mix" class="clip" src="{{AUDIO}}" data-start="0" data-duration="{{TOTAL}}" data-track-index="1" data-volume="1"></audio>
      {{SHOTS}}
      <div id="warm"></div>
      <div id="edge"></div>
      {{ELEMENTS}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      {{JS}}
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
